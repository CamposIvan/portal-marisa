name: Importar dados do 4º ano A para o Supabase
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-grade4-import.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-grade4:
    runs-on: ubuntu-latest
    steps:
      - name: Executar carga validada
        env:
          IMPORT_URL: https://painel-saresp-pei-marisa.vercel.app/api/import-grade4?confirm=grade4-2026-import
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --max-time 180 -X POST -H 'Accept: application/json' -w '\nHTTP_STATUS:%{http_code}' "$IMPORT_URL" || true)
          echo "$response"
          python - <<'PY' "$response"
          import json,sys
          raw=sys.argv[1]
          body,status=raw.rsplit("\\nHTTP_STATUS:",1)
          print("HTTP status:",status)
          if status != "200":
              raise SystemExit("Import endpoint returned HTTP "+status)
          data=json.loads(body)
          assert data.get("ok") is True, data
          assert data.get("imported_records")==180, data
          assert data.get("imported_correlations")==66, data
          print("Importação confirmada: 180 resultados e 66 correlações.")
          PY
