name: Importar dados do 4º ano A para o Supabase
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-grade4-import.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-grade4:
    runs-on: ubuntu-latest
    steps:
      - name: Executar carga validada
        env:
          IMPORT_URL: https://painel-saresp-pei-marisa.vercel.app/api/import-grade4?confirm=grade4-2026-import
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 180 -X POST -H 'Accept: application/json' "$IMPORT_URL")
          echo "$response"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True, d; assert d.get("imported_records")==180, d; assert d.get("imported_correlations")==66, d; print("Importação confirmada: 180 resultados e 66 correlações.")' "$response"
