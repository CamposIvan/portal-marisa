name: Verificar integração SARESP Supabase
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-supabase-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4
      - name: Validar endpoint e dados publicados
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://painel-saresp-pei-marisa.vercel.app/api/saresp"
          last = None
          data = None
          for attempt in range(1, 25):
              try:
                  req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"SARESP-smoke-test"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      status = response.status
                      raw = response.read().decode("utf-8")
                  if status != 200:
                      raise RuntimeError(f"HTTP {status}: {raw[:350]}")
                  data = json.loads(raw)
                  break
              except Exception as exc:
                  last = repr(exc)
                  print(f"Tentativa {attempt}/24: endpoint ainda indisponível: {last}")
                  time.sleep(5)
          if data is None:
              raise SystemExit(f"Falha ao consultar /api/saresp: {last}")
          records, targets, plan = data.get("records"), data.get("targets"), data.get("plan")
          assert isinstance(records, list), "records não é uma lista"
          assert isinstance(targets, list), "targets não é uma lista"
          assert isinstance(plan, list), "plan não é uma lista"
          assert len(records) == 600, f"Esperava 600 resultados, recebi {len(records)}"
          assert len(targets) == 4, f"Esperava 4 metas, recebi {len(targets)}"
          assert len(plan) == 4, f"Esperava 4 semanas, recebi {len(plan)}"
          catalog = data.get("subject_catalog", data.get("catalog"))
          print("API payload keys:", sorted(data.keys()))
          print("Catalog type:", type(catalog).__name__, "reported catalog_count:", data.get("catalog_count"))
          assert isinstance(catalog, list), f"Catálogo curricular ausente ou inválido; chaves recebidas: {sorted(data.keys())}"
          assert len(catalog) == 24, f"Esperava 24 entradas de catálogo, recebi {len(catalog)}"
          assert sum(1 for x in records if x.get("grade_label") == "6° ANO") == 240, "Esperava 240 resultados do 6º ano A"
          assert len({x.get("source_file") for x in records}) == 9, "Esperava os seis CSVs do 5º ano e os três XLSX do 6º ano"
          assert all(x.get("lesson_url") and x.get("question_url") for x in records), "Há registro sem link de aula/questão"
          assert sum(1 for x in records if x.get("is_mapa_foco_saresp")) == 132, "Quantidade de marcadores Mapa Foco divergente"
          assert not any(x.get("is_mapa_foco_saresp") for x in records if x.get("grade_label") == "6° ANO"), "O 6º ano não deve ser marcado como Mapa Foco antes da validação específica"
          print(json.dumps({
              "status":"ok",
              "records":len(records),
              "distinct_source_files":len({r.get("source_file") for r in records}),
              "grade_6_records":sum(r.get("grade_label") == "6° ANO" for r in records),
              "catalog_entries":len(catalog),
              "records_with_lesson_and_question":sum(bool(r.get("lesson_url") and r.get("question_url")) for r in records),
              "mapa_foco_records":sum(bool(r.get("is_mapa_foco_saresp")) for r in records),
              "planning_targets":len(targets),
              "intervention_weeks":len(plan),
              "refreshed_at":data.get("refreshed_at")
          }, ensure_ascii=False, indent=2))
          PY
      - name: Validar JavaScript do projeto
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = False
                  self.parts = []
                  self.attrs = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.attrs = dict(attrs)
                      self.current = not bool(self.attrs.get("src"))
                      if self.current:
                          self.parts.append([])
              def handle_data(self, data):
                  if self.current:
                      self.parts[-1].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.current = False
          html = Path("index.html").read_text(encoding="utf-8")
          print("Repository HTML bytes:",len(html))
          print("Contains Supabase loader:", "function loadSupabaseData" in html)
          print("Contains Mapa Foco catalog:", 'id="mapaFocoSubjects"' in html)
          print("Contains grade/class filter:", 'id="bankClass"' in html)
          assert "function loadSupabaseData" in html, "Carregador Supabase ausente"
          assert 'id="mapaFocoSubjects"' in html, "Catálogo Mapa Foco ausente"
          assert 'id="bankClass"' in html, "Filtro ano/turma ausente"
          parser = Scripts()
          parser.feed(html)
          scripts = ["".join(parts) for parts in parser.parts]
          print("Inline script count:",len(scripts),"script lengths:",[len(x) for x in scripts])
          candidates = [js for js in scripts if "function loadSupabaseData" in js]
          if not candidates:
              raise SystemExit("A página publicada não contém o carregador do Supabase. Verifique a versão do HTML/alias.")
          open("/tmp/painel-saresp.js", "w", encoding="utf-8").write(candidates[-1])
          print("JavaScript inline localizado; linhas:", len(candidates[-1].splitlines()))
          PY
          node --check /tmp/painel-saresp.js
