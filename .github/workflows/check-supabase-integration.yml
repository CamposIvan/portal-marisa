name: Verificar integração SARESP Supabase
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-supabase-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Validar endpoint e dados publicados
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error, sys
          url = "https://painel-saresp-pei-marisa.vercel.app/api/saresp"
          last = None
          data = None
          for attempt in range(1, 25):
              try:
                  req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"SARESP-smoke-test"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      status = response.status
                      raw = response.read().decode("utf-8")
                  if status != 200:
                      raise RuntimeError(f"HTTP {status}: {raw[:350]}")
                  data = json.loads(raw)
                  break
              except Exception as exc:
                  last = repr(exc)
                  print(f"Tentativa {attempt}/24: endpoint ainda indisponível: {last}")
                  time.sleep(5)
          if data is None:
              raise SystemExit(f"Falha ao consultar /api/saresp: {last}")
          records = data.get("records")
          targets = data.get("targets")
          plan = data.get("plan")
          assert isinstance(records, list), "records não é uma lista"
          assert isinstance(targets, list), "targets não é uma lista"
          assert isinstance(plan, list), "plan não é uma lista"
          assert len(records) == 360, f"Esperava 360 resultados, recebi {len(records)}"
          assert len(targets) == 4, f"Esperava 4 metas, recebi {len(targets)}"
          assert len(plan) == 4, f"Esperava 4 semanas, recebi {len(plan)}"
          assert all(x.get("lesson_url") and x.get("question_url") for x in records), "Há registro sem link de aula/questão"
          assert sum(1 for x in records if x.get("is_mapa_foco_saresp")) == 132, "A quantidade de marcadores Mapa Foco divergiu da base importada"
          print(json.dumps({
              "status":"ok",
              "records":len(records),
              "distinct_source_files":len({r.get("source_file") for r in records}),
              "records_with_lesson_and_question":sum(bool(r.get("lesson_url") and r.get("question_url")) for r in records),
              "mapa_foco_records":sum(bool(r.get("is_mapa_foco_saresp")) for r in records),
              "planning_targets":len(targets),
              "intervention_weeks":len(plan),
              "refreshed_at":data.get("refreshed_at")
          }, ensure_ascii=False, indent=2))
          PY
